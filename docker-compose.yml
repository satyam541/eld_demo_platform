# Local development infrastructure stack.
# Production deployment is described in execution-plan/06-phase-f-devops.md
# and uses Coolify on Hetzner — this compose file is dev-only.

services:
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    container_name: eld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eld
      POSTGRES_PASSWORD: eld_dev
      POSTGRES_DB: eld
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eld -d eld"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eld-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dev"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    container_name: eld-emqx
    restart: unless-stopped
    environment:
      EMQX_NAME: eld-emqx
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT/WS
      - "8883:8883"   # MQTT/TLS
      - "18083:18083" # Dashboard
    volumes:
      - emqxdata:/opt/emqx/data
      - emqxlog:/opt/emqx/log

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: eld-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: eld
      SOKETI_DEFAULT_APP_KEY: dev_key
      SOKETI_DEFAULT_APP_SECRET: dev_secret
      SOKETI_DEFAULT_APP_USER_AUTHENTICATION: "true"
    ports:
      - "6001:6001"
      - "9601:9601" # Prometheus metrics

volumes:
  pgdata:
  redisdata:
  emqxdata:
  emqxlog:
